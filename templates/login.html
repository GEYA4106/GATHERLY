{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Log in</h1>
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Email<input type="email" name="email" value="{{ form.get('email','') }}" required autofocus autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn block" type="submit">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
