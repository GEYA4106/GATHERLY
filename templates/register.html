{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Create your account</h1>
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Full name<input name="name" value="{{ form.get('name','') }}" required autocomplete="name"></label>
    <label>Email<input type="email" name="email" value="{{ form.get('email','') }}" required autocomplete="email"></label>
    <label>Phone <small class="muted">(optional)</small><input type="tel" name="phone" value="{{ form.get('phone','') }}" autocomplete="tel"></label>
    <div class="two">
      <label>Password<input type="password" name="password" minlength="6" required autocomplete="new-password"></label>
      <label>Confirm<input type="password" name="confirm" minlength="6" required autocomplete="new-password"></label>
    </div>
    <button class="btn block" type="submit">Sign up</button>
  </form>
  <p class="muted center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
